name: CI

# The gate documented in docs/TESTING.md. Two jobs, because the Apple targets of :core only build and test on macOS.
#
# Apple tests never skip silently: with CI=true (set by GitHub Actions) core/build.gradle.kts fails the build when the
# iOS simulator tests cannot run, so a macOS runner without a simulator runtime turns the job red instead of green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (core JVM + Android host, app tests, lint, release build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is the commit count; a shallow clone counts 1 and a signed release from it is refused.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the Android platform (compileSdk 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Test, lint, and build the release APK
        run: >
          ./gradlew
          :core:jvmTest
          :core:testAndroidHostTest
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleRelease

      - name: Check the release signing, versioning and Apple-test-guard rules
        run: scripts/verify-build-config.sh

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-reports
          path: |
            core/build/reports/tests
            core/build/test-results
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  macos:
    name: macOS (every :core target incl. Apple, Apple frameworks)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/verify-build-config.sh clones this checkout and needs the history to derive a versionCode.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the Android platform (compileSdk 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Show the iOS simulators the Apple tests will use
        run: xcrun simctl list devices available

      - name: Test every :core target and link the Apple frameworks
        run: >
          ./gradlew
          :core:allTests
          :core:linkDebugFrameworkMacosArm64
          :core:linkDebugFrameworkIosArm64
          :core:linkDebugFrameworkIosSimulatorArm64
          :core:linkDebugFrameworkIosX64

      - name: Check the Apple-test-guard rules
        run: scripts/verify-build-config.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-reports
          path: |
            core/build/reports/tests
            core/build/test-results
          if-no-files-found: ignore
