<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="northGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="southGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Mountain Silhouettes -->
  <path d="M48 400 L160 250 L256 360 L360 220 L464 400 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M120 400 L220 280 L310 390 L400 300 L464 400 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Topographic Contour Lines -->
  <path d="M32 440 Q 140 370 256 420 T 480 390" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="2"/>
  <path d="M32 460 Q 160 410 256 450 T 480 430" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="2"/>

  <!-- Golden Sun -->
  <circle cx="390" cy="115" r="28" fill="#fbbf24" filter="url(#neonGlow)"/>
  <circle cx="390" cy="115" r="38" fill="url(#sunGlow)"/>

  <!-- Crescent Moon -->
  <path d="M110 95 A 28 28 0 0 0 148 135 A 22 22 0 0 1 118 90 Z" fill="#e2e8f0" filter="url(#neonGlow)"/>

  <!-- Compass Outer Dial Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.9" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- Cardinal Ticks -->
  <line x1="256" y1="102" x2="256" y2="124" stroke="#f43f5e" stroke-width="4"/>
  <line x1="256" y1="388" x2="256" y2="410" stroke="#38bdf8" stroke-width="4"/>
  <line x1="102" y1="256" x2="124" y2="256" stroke="#38bdf8" stroke-width="4"/>
  <line x1="388" y1="256" x2="410" y2="256" stroke="#38bdf8" stroke-width="4"/>

  <!-- Cardinal Letters -->
  <text x="256" y="92" fill="#f43f5e" font-size="28" font-weight="900" font-family="sans-serif" text-anchor="middle">N</text>
  <text x="430" y="265" fill="#e2e8f0" font-size="24" font-weight="800" font-family="sans-serif" text-anchor="middle">E</text>
  <text x="256" y="440" fill="#94a3b8" font-size="24" font-weight="800" font-family="sans-serif" text-anchor="middle">S</text>
  <text x="82" y="265" fill="#e2e8f0" font-size="24" font-weight="800" font-family="sans-serif" text-anchor="middle">W</text>

  <!-- Horizontal Star Points -->
  <polygon points="256,256 360,256 256,242" fill="#38bdf8"/>
  <polygon points="256,256 360,256 256,270" fill="#0284c7"/>
  <polygon points="256,256 152,256 256,242" fill="#38bdf8"/>
  <polygon points="256,256 152,256 256,270" fill="#0284c7"/>

  <!-- Compass Needles -->
  <!-- North Needle (Red) -->
  <polygon points="256,132 238,256 256,256" fill="url(#northGrad)" filter="url(#neonGlow)"/>
  <polygon points="256,132 274,256 256,256" fill="#be123c"/>

  <!-- South Needle (Cyan) -->
  <polygon points="256,380 238,256 256,256" fill="url(#southGrad)" filter="url(#neonGlow)"/>
  <polygon points="256,380 274,256 256,256" fill="#0369a1"/>

  <!-- Center Bezel -->
  <circle cx="256" cy="256" r="22" fill="#0b1329" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="256" r="8" fill="#38bdf8"/>
</svg>
